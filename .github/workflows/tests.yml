# The package's tests and lint, outside Sublime Text: tests/stubs stands in for Sublime's modules.
# Python 3.14 is the plugin host of Sublime Text 4213 and later.
name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # certifi: the requests copied into include/ needs it and doesn't carry it
      - run: pip install pytest ruff certifi
      - run: pytest
      # Only the tests for now: the plugin's own code is linted once the cleanup (#17) lands
      - run: ruff check tests
