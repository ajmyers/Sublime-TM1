# The package's tests and lint, outside Sublime Text: tests/stubs stands in for Sublime's modules.
# Python 3.14 is the plugin host of Sublime Text 4213 and later.
name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r tests/requirements.txt
      - run: pytest
      # The rewritten code, tools and tests; the legacy commands aren't linted, as they're being replaced
      - run: ruff check core plugin tools tests
