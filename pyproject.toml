# Not a Python package: Sublime Text loads this repository as a package of its own.
# This holds the settings of the tools that check it (pytest, Ruff).

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["scrape_tm1_docs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
